name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Test (matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
        node: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies (service=${{ matrix.service }})
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        working-directory: ${{ matrix.service }}

      - name: Run lint (if present)
        run: npm run lint --if-present
        working-directory: ${{ matrix.service }}

      - name: Run tests (if present)
        run: npm run test --if-present -- --ci
        working-directory: ${{ matrix.service }}

      - name: Run npm audit (summary)
        run: npm audit --json > audit-${{ matrix.service }}.json || true
        working-directory: ${{ matrix.service }}

      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.service }}-node${{ matrix.node }}
          path: ${{ matrix.service }}/audit-${{ matrix.service }}.json

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: check
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        working-directory: frontend

      - name: Run frontend lint (if present)
        run: npm run lint --if-present
        working-directory: frontend

      - name: Run frontend tests (if present)
        run: npm run test --if-present -- --ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist